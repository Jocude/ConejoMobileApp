# Al subir un tag vX.Y: pasa los tests, genera el APK y el AAB firmados y publica la Release.
# Secretos necesarios en el repositorio:
#   CONEJO_KEYSTORE_BASE64  keystore de release en base64
#   CONEJO_STORE_PASSWORD, CONEJO_KEY_ALIAS, CONEJO_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publicar release firmada
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ConejoJorge

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.CONEJO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto CONEJO_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CONEJO_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests y build de release (APK y AAB)
        env:
          CONEJO_STORE_PASSWORD: ${{ secrets.CONEJO_STORE_PASSWORD }}
          CONEJO_KEY_ALIAS: ${{ secrets.CONEJO_KEY_ALIAS }}
          CONEJO_KEY_PASSWORD: ${{ secrets.CONEJO_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Renombrar con la versión
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/ConejoJorge-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/ConejoJorge-${GITHUB_REF_NAME}.aab"

      - name: Borrar la clave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ConejoJorge-${{ github.ref_name }}.apk
            dist/ConejoJorge-${{ github.ref_name }}.aab
          generate_release_notes: true
