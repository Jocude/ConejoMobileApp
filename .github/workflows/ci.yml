# Compila, pasa los tests y lint en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests y lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ConejoJorge

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar, tests unitarios y lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Guardar informes de tests y lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes
          path: |
            ConejoJorge/app/build/reports/
            ConejoJorge/app/build/test-results/
          if-no-files-found: ignore

      - name: Guardar APK de pruebas
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: ConejoJorge/app/build/outputs/apk/debug/*.apk
